name: Price Scraper

on:
  schedule:
    # Every 4 hours — keeps prices fresh for app premium users
    - cron: "0 */4 * * *"
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions tab

permissions:
  contents: write  # needed to commit prices.json back to the repo

jobs:
  scrape-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install system dependencies for Chromium
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libgbm1 libnss3 libatk-bridge2.0-0 libatk1.0-0 \
            libcups2 libxkbcommon0 libasound2t64 libx11-6 \
            libxcomposite1 libxdamage1 libxext6 libxfixes3 \
            libxrandr2 libxshmfence1 fonts-liberation

      - name: Install Python dependencies and Playwright browser
        run: |
          pip install -r scraper/requirements.txt
          playwright install chromium

      - name: Run scraper parser tests
        run: python -m unittest discover -s scraper -p "test_*.py"

      - name: Run price scraper
        env:
          SERPAPI_API_KEY:      ${{ secrets.SERPAPI_API_KEY }}
          AMAZON_AFFILIATE_TAG: ${{ secrets.AMAZON_AFFILIATE_TAG }}
          AMAZON_ACCESS_KEY:    ${{ secrets.AMAZON_ACCESS_KEY }}
          AMAZON_SECRET_KEY:    ${{ secrets.AMAZON_SECRET_KEY }}
          DOMYOWN_AFFILIATE_ID: ${{ secrets.DOMYOWN_AFFILIATE_ID }}
          MIN_PRICED_PRODUCTS:  "1"
          SHOPPING_RESULT_LIMIT: "10"
          ORGANIC_RESULT_LIMIT:  "3"
        run: python scraper/scraper.py

      - name: Commit updated prices.json
        run: |
          git config user.name  "price-bot[bot]"
          git config user.email "price-bot@lawndominators.com"
          git pull --rebase --autostash origin main
          git add prices.json
          # Only commit if prices.json actually changed
          git diff --cached --quiet || git commit -m "chore: update prices $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
          git push
