name: Price Scraper

on:
  schedule:
    # Every 3 hours from morning through evening Central time, offset to reduce GitHub schedule drops.
    - cron: "17 11,14,17,20,23,2 * * *"
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions tab
    inputs:
      enable_discovery:
        description: "Use SerpApi once to discover merchant URLs and update product_sources.json"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      send_alerts:
        description: "Send premium push price alerts"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write  # needed to commit prices.json back to the repo

jobs:
  scrape-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install system dependencies for Chromium
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libgbm1 libnss3 libatk-bridge2.0-0 libatk1.0-0 \
            libcups2 libxkbcommon0 libasound2t64 libx11-6 \
            libxcomposite1 libxdamage1 libxext6 libxfixes3 \
            libxrandr2 libxshmfence1 fonts-liberation

      - name: Install Python dependencies and Playwright browser
        run: |
          pip install -r scraper/requirements.txt
          playwright install chromium

      - name: Run scraper parser tests
        run: python -m unittest discover -s scraper -p "test_*.py"

      - name: Run price scraper
        env:
          SERPAPI_API_KEY:      ${{ secrets.SERPAPI_API_KEY }}
          AMAZON_AFFILIATE_TAG: ${{ secrets.AMAZON_AFFILIATE_TAG }}
          AMAZON_CREATOR_CREDENTIAL_ID: ${{ secrets.AMAZON_CREATOR_CREDENTIAL_ID }}
          AMAZON_CREATOR_SECRET: ${{ secrets.AMAZON_CREATOR_SECRET }}
          AMAZON_CREATOR_VERSION: ${{ secrets.AMAZON_CREATOR_VERSION }}
          KEEPA_API_KEY:        ${{ secrets.KEEPA_API_KEY }}
          DOMYOWN_AFFILIATE_ID: ${{ secrets.DOMYOWN_AFFILIATE_ID }}
          MIN_PRICED_PRODUCTS:  "1"
          REQUIRE_WEB_DISCOVERY: "0"
          ENABLE_SERPAPI_DISCOVERY: ${{ github.event_name == 'workflow_dispatch' && inputs.enable_discovery == 'true' && '1' || '0' }}
          ENABLE_KNOWN_RETAILER_SEARCH: "0"
          KNOWN_RETAILER_LIMIT: "8"
          ENABLE_DIRECT_RETAILER_SEARCH: "0"
          ENABLE_ORGANIC_DISCOVERY: "0"
          SHOPPING_RESULT_LIMIT: "10"
          SHOPPING_DETAIL_RESULT_LIMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.enable_discovery == 'true' && '3' || '0' }}
          ORGANIC_RESULT_LIMIT:  "1"
          ORGANIC_FETCH_TIMEOUT: "9000"
          SAVED_SOURCE_LIMIT: "8"
          MAX_SAVED_SOURCES_PER_PRODUCT: "50"
          MIN_CHEMICAL_PRICE: "10"
          MIN_SOIL_AMENDMENT_PRICE: "5"
          REPEATED_PRICE_PRODUCT_LIMIT: "8"
          MIN_ALERT_DROP_PERCENT: "5"
        run: python scraper/scraper.py

      - name: Validate rendered price board
        run: python scraper/validate_price_board.py

      - name: Send premium price alerts
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.send_alerts == 'true' }}
        env:
          PRICE_ALERT_WEBHOOK_URL: ${{ secrets.PRICE_ALERT_WEBHOOK_URL }}
          PRICE_ALERT_WEBHOOK_SECRET: ${{ secrets.PRICE_ALERT_WEBHOOK_SECRET }}
        run: |
          if [ -z "$PRICE_ALERT_WEBHOOK_URL" ] || [ -z "$PRICE_ALERT_WEBHOOK_SECRET" ]; then
            echo "Price alert webhook not configured; skipping."
            exit 0
          fi
          python - <<'PY'
          import json

          with open("price-alerts.json") as f:
              feed = json.load(f)

          generated_at = feed.get("generated_at")
          current_alerts = [
              alert for alert in feed.get("alerts", [])
              if alert.get("created_at") == generated_at
          ]
          output = {
              **feed,
              "alert_count": len(current_alerts),
              "current_alert_count": len(current_alerts),
              "alerts": current_alerts,
          }
          with open("price-alerts-current.json", "w") as f:
              json.dump(output, f, indent=2)

          print(f"Current-run alerts: {len(current_alerts)}")
          PY
          if [ "$(python -c "import json; print(json.load(open('price-alerts-current.json')).get('alert_count', 0))")" = "0" ]; then
            echo "No current-run price alerts; skipping webhook."
            exit 0
          fi
          curl -sS -X POST "$PRICE_ALERT_WEBHOOK_URL" \
            -H "Authorization: Bearer $PRICE_ALERT_WEBHOOK_SECRET" \
            -H "Content-Type: application/json" \
            --data @price-alerts-current.json

      - name: Commit updated prices.json
        run: |
          git config user.name  "price-bot[bot]"
          git config user.email "price-bot@lawndominators.com"
          tmpdir="$(mktemp -d)"
          cp prices.json price-alerts.json source-health.json product_sources.json "$tmpdir"/
          git fetch origin main
          git reset --hard origin/main
          cp "$tmpdir"/prices.json "$tmpdir"/price-alerts.json "$tmpdir"/source-health.json "$tmpdir"/product_sources.json .
          python - <<'PY'
          import json
          from pathlib import Path

          for name in ("prices.json", "price-alerts.json", "source-health.json", "product_sources.json"):
              json.loads(Path(name).read_text())
              print(f"{name} is valid JSON")
          PY
          git add prices.json price-alerts.json source-health.json product_sources.json
          # Only commit if prices.json actually changed
          git diff --cached --quiet || git commit -m "chore: update prices $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
          git push
