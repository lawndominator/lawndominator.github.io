name: Price Scraper Fast Lane

on:
  schedule:
    # Every 45 minutes. API-only (Amazon Creators API / Keepa), no browser --
    # this is a handful of HTTP calls, not a full Playwright sweep, so it can
    # run far more often than the 3-hour full scrape in price-scraper.yml.
    # Four expressions are required because 45 does not divide evenly into
    # an hour; `*/45` would run at :00 and :45 every hour, alternating 45- and
    # 15-minute gaps instead of maintaining a true 45-minute cadence.
    - cron: "0 */3 * * *"
    - cron: "45 0-23/3 * * *"
    - cron: "30 1-23/3 * * *"
    - cron: "15 2-23/3 * * *"
  workflow_dispatch:

permissions:
  contents: write  # needed to commit prices.json back to the repo

# Same group as price-scraper.yml so a full sweep and a fast-lane tick never
# run their git-reset/commit/push steps concurrently and race on the same
# files.
concurrency:
  group: price-feed-write
  cancel-in-progress: false

jobs:
  fast-lane:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install Python dependencies
        # No Chromium install: the fast lane never launches a browser, only
        # Amazon Creators API / Keepa HTTP calls via amazon_result().
        run: pip install -r scraper/requirements.txt

      - name: Run scraper parser tests
        run: python -m unittest discover -s scraper -p "test_*.py"

      - name: Run fast-lane price refresh
        env:
          AMAZON_AFFILIATE_TAG: ${{ secrets.AMAZON_AFFILIATE_TAG }}
          AMAZON_CREATOR_CREDENTIAL_ID: ${{ secrets.AMAZON_CREATOR_CREDENTIAL_ID }}
          AMAZON_CREATOR_SECRET: ${{ secrets.AMAZON_CREATOR_SECRET }}
          AMAZON_CREATOR_VERSION: ${{ secrets.AMAZON_CREATOR_VERSION }}
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
          MIN_CHEMICAL_PRICE: "10"
          MIN_SOIL_AMENDMENT_PRICE: "5"
          MIN_ALERT_DROP_PERCENT: "5"
        run: python scraper/scraper.py --fast-lane

      - name: Commit updated prices.json
        run: |
          git config user.name  "price-bot[bot]"
          git config user.email "price-bot@lawndominators.com"
          tmpdir="$(mktemp -d)"
          cp prices.json price-alerts.json source-health.json "$tmpdir"/
          git fetch origin main
          git reset --hard origin/main
          cp "$tmpdir"/prices.json "$tmpdir"/price-alerts.json "$tmpdir"/source-health.json .
          python - <<'PY'
          import json
          from pathlib import Path

          for name in ("prices.json", "price-alerts.json", "source-health.json"):
              json.loads(Path(name).read_text())
              print(f"{name} is valid JSON")
          PY
          git add prices.json price-alerts.json source-health.json
          # Only commit if something actually changed
          git diff --cached --quiet || git commit -m "chore: fast-lane price update $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
          git push
